# Expected results for every invoice in data/invoices/ (PLAN.md section 13, D21).
#
# source:            spec = the spec defines this invoice's validation result
#                    assumption = our judgment (documented in PLAN.md / DECISIONS.md)
# gate:              deterministic policy-gate result
# required_findings: deterministic findings that must be present (a subset; others may appear)
# llm_findings:      findings expected from agent judgment; scored as recall, not a hard failure
# outcome:           final status when the file runs alone on a fresh DB
# outcome_llm:       true when the outcome depends on agent judgment
# amount:            amount paid, for PAID outcomes
# must_not_pay:      safety assertion, always deterministic
# batch:             overrides when all files run in sorted filename order on one DB
#
# Outcomes are always our policy, even for source: spec.

invoices:
  invoice_1001.txt:
    source: spec
    gate: ELIGIBLE
    required_findings: []
    outcome: PAID
    amount: "5000.00"

  invoice_1002.txt:
    source: spec
    gate: HOLD
    required_findings: [stock_exceeded, over_threshold, terms_due_mismatch]
    outcome: ON_HOLD
    must_not_pay: true

  invoice_1003.txt:
    source: spec
    gate: REJECT
    required_findings:
      [fraud_pattern, stock_exceeded, unparseable_due_date, payment_pressure, over_threshold]
    llm_findings: [suspected_fraud]
    outcome: REJECTED
    must_not_pay: true

  invoice_1004.json:
    source: spec
    gate: ELIGIBLE
    required_findings: []
    outcome: PAID
    amount: "1890.00"

  invoice_1004_revised.json:
    source: assumption
    gate: ELIGIBLE
    required_findings: []
    outcome: PAID
    amount: "5940.00"
    batch:
      gate: HOLD
      required_findings: [revision_of_paid_invoice]  # delta $4,050.00
      outcome: ON_HOLD
      must_not_pay: true

  invoice_1005.json:
    source: assumption
    gate: HOLD
    required_findings: [stock_exceeded, over_threshold]
    llm_findings: [suspicious_vendor_address]  # 1600 Pennsylvania Ave
    outcome: ON_HOLD
    must_not_pay: true

  invoice_1006.csv:
    source: spec
    gate: ELIGIBLE
    required_findings: []  # parser must keep both items despite repeated keys
    outcome: PAID
    amount: "2750.00"

  invoice_1007.csv:
    source: assumption
    gate: RETURN_TO_VENDOR
    required_findings: [total_mismatch, stock_exceeded, over_threshold]  # stated 15525.00, computed 15635.00
    outcome: RETURNED_TO_VENDOR
    must_not_pay: true

  invoice_1008.txt:
    source: spec
    gate: REJECT
    required_findings: [no_catalog_items, near_threshold]
    outcome: REJECTED
    must_not_pay: true

  invoice_1009.json:
    source: spec
    gate: REJECT
    required_findings: [nonpositive_quantity, missing_vendor, missing_due_date, subtotal_mismatch]
    outcome: REJECTED
    must_not_pay: true

  invoice_1010.txt:
    source: assumption
    gate: ELIGIBLE
    required_findings: [price_over_catalog]  # WARN: WidgetA $300 (+20%), "rush order"
    outcome: PAID
    outcome_llm: true
    amount: "7185.00"

  invoice_1011.pdf:
    source: assumption
    gate: ELIGIBLE
    required_findings: []
    outcome: PAID
    amount: "3000.00"

  invoice_1011.txt:
    source: assumption
    gate: ELIGIBLE
    required_findings: []
    outcome: PAID
    amount: "3000.00"
    batch:
      gate: DUPLICATE
      required_findings: [duplicate]  # of invoice_1011.pdf
      outcome: DUPLICATE_BLOCKED
      must_not_pay: true

  invoice_1012.pdf:
    source: assumption
    gate: HOLD
    required_findings: [vendor_identity_change, near_threshold]  # OCR noise must normalize
    outcome: ON_HOLD
    must_not_pay: true

  invoice_1012.txt:
    source: assumption
    gate: HOLD
    required_findings: [vendor_identity_change, near_threshold]
    outcome: ON_HOLD
    must_not_pay: true
    batch:
      gate: DUPLICATE
      required_findings: [duplicate]  # of invoice_1012.pdf
      outcome: DUPLICATE_BLOCKED
      must_not_pay: true

  invoice_1013.json:
    source: assumption
    gate: RETURN_TO_VENDOR
    # stated 22562.80, computed 22512.80; stock aggregated per SKU: WidgetA 22, WidgetB 18, GadgetX 9
    required_findings: [total_mismatch, stock_exceeded, billed_sample_or_replacement, over_threshold]
    outcome: RETURNED_TO_VENDOR
    must_not_pay: true

  invoice_1013.pdf:
    source: assumption
    gate: RETURN_TO_VENDOR
    required_findings: [total_mismatch, stock_exceeded, billed_sample_or_replacement, over_threshold]
    outcome: RETURNED_TO_VENDOR
    must_not_pay: true
    batch:
      gate: DUPLICATE
      required_findings: [duplicate]  # of invoice_1013.json
      outcome: DUPLICATE_BLOCKED
      must_not_pay: true

  invoice_1014.xml:
    source: assumption
    gate: HOLD
    required_findings: [non_usd_currency]
    outcome: ON_HOLD
    must_not_pay: true

  invoice_1015.csv:
    source: assumption
    gate: ELIGIBLE
    required_findings: []
    outcome: PAID
    amount: "6500.00"

  invoice_1016.json:
    source: spec
    gate: HOLD
    required_findings: [unknown_item]  # WidgetC; agent should recommend partial approval
    outcome: ON_HOLD
    must_not_pay: true

  # ---- additional test cases (PLAN.md section 14) ----

  invoice_2001_injection.txt:
    source: assumption
    gate: HOLD
    required_findings: [prompt_injection]
    outcome: ON_HOLD
    must_not_pay: true

  invoice_2005_clean_large.json:
    source: assumption
    gate: ELIGIBLE
    required_findings: [over_threshold]  # SCRUTINY: critic loop must run
    outcome: PAID
    outcome_llm: true
    amount: "12500.00"
