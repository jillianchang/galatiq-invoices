# What a correct extraction returns for every invoice that goes through the LLM
# (text, email, and PDF), in the extraction agent's output format.
#
# Used three ways:
#   - tests/test_rules.py validates these through the real rules (no LLM);
#   - tests/oracle.py replays them as a perfect fake LLM to test the eval harness;
#   - evals/run.py scores the live extraction against them (field accuracy).
#
# Values are copied as printed, like the prompt asks: dates stay raw, numbers
# drop "$" and ",", OCR'd "O" reads as 0. `notes` and `vendor_address` aren't
# scored (free text).

defaults: &defaults
  vendor_address: null
  currency: USD
  subtotal: null
  tax_rate_percent: null
  tax_amount: null
  shipping: null
  payment_terms: null
  notes: null

